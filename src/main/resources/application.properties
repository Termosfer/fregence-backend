spring.application.name=fregence

# Server Port (Hosting üçün lazımdır)
server.port=${PORT:8080}

# Database Tənzimləmələri (Placeholder-lərlə)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/perfumedb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Secret
app.jwt.secret=${JWT_SECRET}

# Fayl yükləmə limiti
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Cloudinary Configuration (Professional format)
app.cloudinary.cloud-name=${CLOUDINARY_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Redis server ayarları
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# SSL mütləqdir (Upstash üçün)
spring.data.redis.ssl.enabled=true

spring.cache.type=redis

STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}

app.telegram.token=${TELEGRAM_BOT_TOKEN}
app.telegram.chat-id=${TELEGRAM_CHAT_ID}
app.admin.url=${ADMIN_FRONTEND_URL}